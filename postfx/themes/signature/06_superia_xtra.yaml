# 06_superia_xtra
# Fujifilm Superia X-TRA 400 — punchy consumer film with Fuji's signature green-leaning shadows.
# Suited for: everyday snapshots, street, youth/lifestyle, casual portraits.
name: superia_xtra
description: Punchy Fuji film, green-leaning shadows, vivid greens

white_balance: { temp: 0.04, tint: -0.05 }
exposure: { stops: 0.04 }
highlight_rolloff: { knee: 0.7, strength: 0.45 }
lift_gamma_gain:
  lift:  [0.002, 0.006, 0.004]
  gamma: [1.01, 1.02, 1.0]
  gain:  [1.0, 1.03, 1.02]
split_toning:
  shadow:    [-0.006, 0.016, 0.006]
  highlight: [0.016, 0.01, -0.014]
  strength: 0.5
tone_curve: { strength: 0.36, pivot: 0.45 }
vibrance: { vibrance: 0.16, saturation: 1.12, skin_protect: 0.5 }
halation: { threshold: 0.75, radius_frac: 0.011, tint: [1.0, 0.6, 0.45], strength: 0.35 }
distortion: { k: -0.006 }
chromatic_aberration: { amount: 0.0016 }
vignette: { strength: 0.24, feather: 0.48 }
black_point: { lift: 0.014 }
clarity: { amount: 0.18, radius_frac: 0.03 }
grain: { luma: 0.026, chroma: 0.012, size: 1.7, floor: 0.14 }
sharpen: { amount: 0.4, radius_frac: 0.0015, halo: 0.0 }
jpeg: { quality: 92, cycles: 0 }
