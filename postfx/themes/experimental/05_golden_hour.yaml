# 05_golden_hour
# Strong warm WB; heavy halation, golden highlights, sunset light.
# Suited for: outdoor portrait, golden-hour shoots, romantic/lifestyle, travel.
name: golden_hour
description: Strong warm WB, heavy halation, golden highlights

white_balance: { temp: 0.5, tint: 0.06 }
exposure: { stops: 0.1 }
highlight_rolloff: { knee: 0.6, strength: 0.7 }
lift_gamma_gain:
  lift:  [0.01, 0.005, 0.0]
  gamma: [1.02, 1.0, 0.97]
  gain:  [1.06, 1.0, 0.9]
split_toning:
  shadow:    [-0.01, 0.0, 0.02]
  highlight: [0.06, 0.03, -0.04]
  strength: 0.7
tone_curve: { strength: 0.22, pivot: 0.45 }
vibrance: { vibrance: 0.2, saturation: 1.05, skin_protect: 0.6 }
halation: { threshold: 0.6, radius_frac: 0.02, tint: [1.0, 0.5, 0.25], strength: 0.9 }
distortion: { k: -0.008 }
chromatic_aberration: { amount: 0.0015 }
vignette: { strength: 0.3, feather: 0.45 }
black_point: { lift: 0.02 }
clarity: { amount: 0.12, radius_frac: 0.035 }
grain: { luma: 0.022, chroma: 0.005, size: 0.68, floor: 0.15 }
sharpen: { amount: 0.35, radius_frac: 0.0015, halo: 0.0 }
jpeg: { quality: 94, cycles: 0 }
